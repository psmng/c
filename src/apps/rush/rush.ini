# rush_test configuration
[global]
stats_interval = 1
csv = /tmp/rush_result.csv

# ---- 원장서버 (Tuxedo WSL listener, WSNADDR) ----
[target.led1]
addr = //10.10.1.11:7001
[target.led2]
addr = //10.10.1.12:7001
[target.led3]
addr = //10.10.1.13:7001
# user = rush
# passwd = xxxx          ; only if SECURITY is on

# ---- job: different logs run at the same time ----
# tps       : total TPS of the job (split evenly over procs, 0 = unlimited)
# inflight  : 0 = sync tpcall, N>0 = async tpacall with N outstanding per proc
# procs     : worker processes; spread round-robin over targets
# parse_skip: number of leading '|' fields to ignore (timestamp etc.)
[job.order]
log = /data/replay/order_20260930.log
targets = led1,led2,led3
procs = 6
tps = 3000
ramp_sec = 30
duration_sec = 600
inflight = 16
loop = 1
timeout_sec = 30
parse_skip = 1

[job.balance]
log = /data/replay/balance_20260930.log
targets = led1,led2
procs = 4
tps = 1000
ramp_sec = 30
duration_sec = 600
inflight = 0
loop = 1
parse_skip = 1